name: Release

# Release gate. Cuts a v* release from main's
# HEAD: tags it only after ci passed on that commit (waiting for a run still
# in progress), then builds the binaries for every platform and publishes a
# GitHub release. kray ships binaries, not images.
#
#   gh workflow run release.yml                    # next patch after the latest v* tag
#   gh workflow run release.yml -f version=0.1.0   # explicit version
#
# Run it from main only (the default). Every job builds the commit that the
# run was dispatched at (github.sha), so the tag, the binaries, the signature
# and the provenance all name the same commit.
#
# Three jobs, each with the least permissions it needs:
#
#   gate     resolve the version, require green ci on the commit  (read only)
#   build    binaries, SBOMs, SHA256SUMS, cosign signature of SHA256SUMS,
#            build provenance attestation                         (OIDC, attestations)
#   publish  verify the signature, create the tag and the release (contents: write)
#
# Release assets: one binary per platform, one SPDX SBOM per binary,
# SHA256SUMS (covers binaries and SBOMs), SHA256SUMS.sigstore.json (cosign
# keyless bundle) and provenance.sigstore.json (the attestation bundle).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0. Leave blank for the next patch.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read # read the commit and the tags
      actions: read # read the gated ci run
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::run the release from main, not ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve commit and version
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "${sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::checked out ${sha}, expected ${GITHUB_SHA}"
            exit 1
          fi
          last="$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')"
          if [ -z "${VERSION}" ]; then
            IFS=. read -r major minor patch <<<"${last#v}"
            VERSION="${major:-0}.${minor:-0}.$((${patch:-0} + 1))"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${VERSION}' is not X.Y.Z"
            exit 1
          fi
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists"
            exit 1
          fi
          if [ -n "${last}" ] && [ "$(git rev-parse "${last}^{commit}")" = "${sha}" ]; then
            echo "::error::${last} already points at main's HEAD ${sha}; nothing to release"
            exit 1
          fi
          {
            echo "sha=${sha}"
            echo "tag=${tag}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} at ${sha} (previous: ${last:-none})"

      # ci runs on push only for main; gh run watch waits for a run in progress.
      - name: Require green ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          id=""
          for _ in 1 2 3 4 5 6; do
            id="$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No ci push run on $SHA."
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          if ! gh run watch "$id" --exit-status --interval 30 >/dev/null; then
            echo "::error::ci did not pass on $SHA: $url"
            exit 1
          fi
          echo "ci passed: $url"

  build:
    name: build
    needs: gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read # check out the commit
      id-token: write # OIDC token for the Sigstore signing certificates
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build does not read a cache that other runs wrote

      - name: Build binaries
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: make dist VERSION="${VERSION}"

      # Syft reads the module list that the Go linker writes into each binary,
      # so the SBOM lists what is in the binary, not every module in go.sum.
      # It is a separate tool: no new dependency in go.mod.
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3 (syft v1.54.0)

      - name: SBOMs and checksums
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          for bin in *; do
            sbom="${bin%.exe}.spdx.json"
            "$SYFT" scan "file:${bin}" --output "spdx-json=${sbom}"
          done
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow file, the ref and the
      # commit. Sigstore's public Fulcio and Rekor record it (see SECURITY.md).
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Keep the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" dist/provenance.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [gate, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The same checks a user runs (SECURITY.md), before anything is public.
      - name: Verify checksums and signature
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}"
          gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes --verify-tag
          {
            echo "### Released ${TAG}"
            echo
            echo "Tagged \`${SHA}\` and published binaries, SBOMs, SHA256SUMS with a cosign"
            echo "signature, and a build provenance attestation."
          } >> "$GITHUB_STEP_SUMMARY"
