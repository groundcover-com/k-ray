# Weekly updates for Go modules and GitHub Actions. govulncheck in CI catches
# known vulnerabilities between updates.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
