---
apiVersion: v1
kind: Namespace
metadata: {name: held-init}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing-web, namespace: held-init}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-web}}
  template:
    metadata:
      labels: {app: billing-web}
    spec:
      containers:
      - name: billing-web
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"checkout page rendered ms=9\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing-cache, namespace: held-init}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-cache}}
  template:
    metadata:
      labels: {app: billing-cache}
    spec:
      containers:
      - name: billing-cache
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"hit_ratio=0.93\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: feature-flags, namespace: held-init}
spec:
  replicas: 1
  selector: {matchLabels: {app: feature-flags}}
  template:
    metadata: {labels: {app: feature-flags}}
    spec:
      containers:
      - name: feature-flags
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          mkdir -p /www; echo ok > /www/index.html; echo ok > /www/ready
          echo "feature-flags listening on :8080"
          exec httpd -f -vv -p 8080 -h /www
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: feature-flags, namespace: held-init}
spec:
  selector: {app: feature-flags}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: invoice-api, namespace: held-init}
spec:
  replicas: 1
  selector: {matchLabels: {app: invoice-api}}
  template:
    metadata: {labels: {app: invoice-api}}
    spec:
      initContainers:
      - name: wait-flags
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          n=0
          until wget -q -T 2 -O /dev/null http://feature-flags:8080/ready/v2 2>/tmp/err; do
            n=$((n+1))
            echo "attempt $n: GET /ready/v2 failed: $(tail -1 /tmp/err) (Authorization: Bearer KRAYCANARYinitTok7d1e90)"
            sleep 10
          done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
      containers:
      - name: invoice-api
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"invoice batch processed\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
