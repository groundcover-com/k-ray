---
apiVersion: v1
kind: Namespace
metadata: {name: held-hpa}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart-web, namespace: held-hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart-web}}
  template:
    metadata:
      labels: {app: cart-web}
    spec:
      containers:
      - name: cart-web
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"cart updated items=3\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart-cache, namespace: held-hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart-cache}}
  template:
    metadata:
      labels: {app: cart-cache}
    spec:
      containers:
      - name: cart-cache
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"hit_ratio=0.88\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-api, namespace: held-hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout-api}}
  template:
    metadata: {labels: {app: checkout-api}}
    spec:
      containers:
      - name: checkout-api
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        env:
        - {name: CHECKOUT_STRIPE_KEY, value: sk_test_KRAYCANARYhpa88e1f2}
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"order accepted p99=480ms queue_depth=212\""; sleep 20; done
        resources: {requests: {cpu: 5m, memory: 4Mi}}
      - name: log-shipper
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"shipped 40 lines\""; sleep 30; done
        resources: {requests: {memory: 4Mi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: checkout-api, namespace: held-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: checkout-api}
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
