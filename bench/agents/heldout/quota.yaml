---
apiVersion: v1
kind: Namespace
metadata: {name: held-quota}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-api, namespace: held-quota}
spec:
  replicas: 1
  selector: {matchLabels: {app: report-api}}
  template:
    metadata:
      labels: {app: report-api}
    spec:
      containers:
      - name: report-api
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"rendered report id=8841 rows=120\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-cache, namespace: held-quota}
spec:
  replicas: 1
  selector: {matchLabels: {app: report-cache}}
  template:
    metadata:
      labels: {app: report-cache}
    spec:
      containers:
      - name: report-cache
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"cache size=31 entries\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-worker, namespace: held-quota}
spec:
  replicas: 2
  selector: {matchLabels: {app: report-worker}}
  template:
    metadata: {labels: {app: report-worker}}
    spec:
      containers:
      - name: report-worker
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"picked job from queue, rendering\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
