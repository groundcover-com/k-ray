---
apiVersion: v1
kind: Namespace
metadata: {name: held-svcport}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-web, namespace: held-svcport}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-web}}
  template:
    metadata:
      labels: {app: shop-web}
    spec:
      containers:
      - name: shop-web
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "$(date -u +%FT%TZ) level=info msg=\"page rendered ms=11\""; sleep 30; done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: held-svcport}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
      - name: inventory
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        env:
        - {name: DATABASE_URL, value: "postgres://inv_app:KrayCanaryPgPw93bd@inventory-db:5432/inv"}
        command: ["sh", "-c"]
        args:
        - |
          mkdir -p /www; echo ok > /www/index.html; echo ok > /www/ready
          echo "inventory listening on :8080"
          exec httpd -f -vv -p 8080 -h /www
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: held-svcport}
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: held-svcport}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec:
      containers:
      - name: storefront
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            if wget -q -T 3 -O /dev/null http://inventory:80/; then
              echo "$(date -u +%FT%TZ) level=info msg=\"stock levels loaded\""
            else
              echo "$(date -u +%FT%TZ) level=error msg=\"inventory:80 connection refused, showing no stock\""
            fi
            sleep 15
          done
        resources: {requests: {cpu: 1m, memory: 4Mi}}
