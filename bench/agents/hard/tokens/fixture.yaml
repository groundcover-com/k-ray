# storefront, revision 1. release-2.yaml is the revision that never becomes ready.
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: shop-web, labels: {app: storefront}}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: storefront}}
  template:
    metadata:
      labels: {app: storefront}
      annotations: {release: "2026.11.1"}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: storefront
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www; echo ok > /www/healthz; echo '<h1>storefront</h1>' > /www/index.html
              awk -v n=2000 'BEGIN{srand(5); split("orders items cart users search stock prices",p," "); for(i=0;i<n;i++){ printf "level=INFO svc=storefront msg=\"request handled\" req=%08x path=/%s status=200 duration_ms=%d\n", int(rand()*2147483647), p[int(rand()*7)+1], int(rand()*90)+1 }}'
              exec httpd -f -p 8080 -h /www
          env: [{name: BANNER_TEXT, value: "Autumn sale"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 2m, memory: 6Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: storefront, namespace: shop-web, labels: {app: storefront}}
spec:
  selector: {app: storefront}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge, namespace: shop-web, labels: {app: edge}}
spec:
  replicas: 3
  selector: {matchLabels: {app: edge}}
  template:
    metadata: {labels: {app: edge}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: edge
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              awk -v n=1500 'BEGIN{srand(9); split("products cart session banners search",p," "); for(i=0;i<n;i++){ printf "level=INFO svc=edge msg=\"proxied\" req=%08x path=/api/%s status=200 duration_ms=%d\n", int(rand()*2147483647), p[int(rand()*5)+1], int(rand()*60)+1 }}'
              while true; do
                if wget -q -T 2 -O /dev/null http://catalog.shop-data.svc.cluster.local/healthz 2>/dev/null; then
                  echo "level=INFO svc=edge msg=proxied method=GET path=/api/products upstream=catalog.shop-data.svc.cluster.local:80 status=200"
                else
                  echo "level=ERROR svc=edge msg=\"upstream failed\" method=GET path=/api/products upstream=catalog.shop-data.svc.cluster.local:80 status=502"
                fi
                if wget -T 2 -O /dev/null http://inventory.shop-data.svc.cluster.local/healthz >/dev/null 2>&1; then
                  echo "level=INFO svc=edge msg=proxied method=GET path=/api/stock upstream=inventory.shop-data.svc.cluster.local:80 status=200"
                else
                  detail=$(wget -T 2 -O /dev/null http://inventory.shop-data.svc.cluster.local/healthz 2>&1 | tail -1)
                  echo "level=ERROR svc=edge msg=\"upstream failed\" method=GET path=/api/stock upstream=inventory.shop-data.svc.cluster.local:80 status=502 error=\"Bad Gateway\" detail=\"$detail\""
                fi
                sleep 10
              done
          resources: {requests: {cpu: 1m, memory: 4Mi}}
---
apiVersion: v1
