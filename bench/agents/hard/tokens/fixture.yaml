apiVersion: apps/v1
kind: StatefulSet
metadata: {name: checkout, namespace: shop-orders, labels: {app: checkout}}
spec:
  replicas: 20
  serviceName: checkout
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: checkout
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              ord=${HOSTNAME##*-}
              sleep $((ord * 4))
              bad=0
              case "$ord" in 3|10|17) bad=1;; esac
              awk -v bad=$bad -v ord=$ord 'function trace(   k) {
                printf "ERROR [http-nio-8080-exec-%d] c.shop.checkout.PaymentService - payment authorization failed order=ORD-%06d\n", int(rand()*40)+1, int(rand()*999999)
                print "com.shop.checkout.PaymentException: authorization call to the payment gateway failed"
                for (k=1;k<=n1;k++) print "\tat " f1[k]
                print "Caused by: java.net.SocketTimeoutException: Read timed out"
                for (k=1;k<=n2;k++) print "\tat " f2[k]
                print "Caused by: java.net.ConnectException: Connection to payment-gateway.paynet.example:443 timed out after 5000 ms (pool=payments, retries=0)"
                for (k=1;k<=n3;k++) print "\tat " f3[k]
                print "\t... 27 more"
              }
              BEGIN {
                srand(ord*7+3)
                n1=split("com.shop.checkout.PaymentService.authorize(PaymentService.java:142);com.shop.checkout.CheckoutController.pay(CheckoutController.java:88);jdk.internal.reflect.DirectMethodHandleAccessor.invoke(DirectMethodHandleAccessor.java:103);java.base/java.lang.reflect.Method.invoke(Method.java:580);org.springframework.web.method.support.InvocableHandlerMethod.doInvoke(InvocableHandlerMethod.java:255);org.springframework.web.method.support.InvocableHandlerMethod.invokeForRequest(InvocableHandlerMethod.java:188);org.springframework.web.servlet.mvc.method.annotation.ServletInvocableHandlerMethod.invokeAndHandle(ServletInvocableHandlerMethod.java:118);org.springframework.web.servlet.DispatcherServlet.doDispatch(DispatcherServlet.java:1089);org.springframework.web.servlet.DispatcherServlet.doService(DispatcherServlet.java:979);org.springframework.web.servlet.FrameworkServlet.processRequest(FrameworkServlet.java:1014);org.apache.catalina.core.StandardWrapperValve.invoke(StandardWrapperValve.java:167);org.apache.coyote.http11.Http11Processor.service(Http11Processor.java:400)", f1, ";")
                n2=split("java.base/sun.nio.ch.NioSocketImpl.timedRead(NioSocketImpl.java:288);java.base/sun.nio.ch.NioSocketImpl.implRead(NioSocketImpl.java:314);java.base/java.net.Socket$SocketInputStream.read(Socket.java:1099);com.shop.http.PooledClient.execute(PooledClient.java:211);com.shop.http.PooledClient.post(PooledClient.java:97);com.shop.checkout.gateway.PaymentGatewayClient.authorize(PaymentGatewayClient.java:61);com.shop.checkout.PaymentService.authorize(PaymentService.java:131)", f2, ";")
                n3=split("java.base/sun.nio.ch.NioSocketImpl.connect(NioSocketImpl.java:546);java.base/java.net.Socket.connect(Socket.java:752);com.shop.http.PooledClient.openConnection(PooledClient.java:174);com.shop.http.PooledClient.acquire(PooledClient.java:150);com.shop.http.PooledClient.execute(PooledClient.java:203);com.shop.http.PooledClient.post(PooledClient.java:97);com.shop.checkout.gateway.PaymentGatewayClient.authorize(PaymentGatewayClient.java:61);com.shop.checkout.PaymentService.authorize(PaymentService.java:131)", f3, ";")
                split("orders items cart users coupons stock prices",p," ")
                t=0
                for (i=0;i<10000;i++) {
                  printf "level=INFO svc=checkout pod=checkout-%d msg=\"request handled\" req=%08x path=/api/%s status=200 duration_ms=%d\n", ord, int(rand()*2147483647), p[int(rand()*7)+1], int(rand()*240)+2
                  if (bad && i%19==5) { t++; trace() }
                }
              }'
              echo "level=INFO svc=checkout msg=\"startup complete, serving traffic\""
              exec sleep 3600000
          resources: {requests: {cpu: 1m, memory: 4Mi}}
