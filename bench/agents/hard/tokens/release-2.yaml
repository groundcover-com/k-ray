# storefront, revision 2: the readiness probe path and two unrelated edits.
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: shop-web, labels: {app: storefront}}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: storefront}}
  template:
    metadata:
      labels: {app: storefront}
      annotations: {release: "2026.11.2"}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: storefront
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www; echo ok > /www/healthz; echo '<h1>storefront</h1>' > /www/index.html
              awk -v n=2000 'BEGIN{srand(5); split("orders items cart users search stock prices",p," "); for(i=0;i<n;i++){ printf "level=INFO svc=storefront msg=\"request handled\" req=%08x path=/%s status=200 duration_ms=%d\n", int(rand()*2147483647), p[int(rand()*7)+1], int(rand()*90)+1 }}'
              exec httpd -f -p 8080 -h /www
          env: [{name: BANNER_TEXT, value: "Black Friday"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 2m, memory: 6Mi}}
