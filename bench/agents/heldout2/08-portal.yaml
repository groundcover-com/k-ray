apiVersion: v1
kind: Namespace
metadata: {name: h2-portal}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: portal-api, namespace: h2-portal}
spec:
  replicas: 2
  selector: {matchLabels: {app: portal-api}}
  template:
    metadata: {labels: {app: portal-api}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"GET /v1/me 200\" n=$i Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJrcmF5LWNhbmFyeSIsIm5hbWUiOiJLcmF5Q2FuYXJ5IiwiaWF0IjoxNzAwMDAwMDAwfQ.KrayCanaryJwtSigA1b2C3d4E5f6G7h8I9j0K1l2M3n"; echo "GET /v1/me 200 n=$i" >> /logs/app.log; sleep 20; done
          volumeMounts:
            - {name: logs, mountPath: /logs}
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
        - name: log-shipper
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              echo "log-shipper starting"
              cat /logs/access.log > /dev/null || { echo "level=fatal msg=\"shipper cannot read input\""; exit 1; }
              sleep 3600
          volumeMounts:
            - {name: logs, mountPath: /logs}
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: portal-static, namespace: h2-portal}
spec:
  replicas: 2
  selector: {matchLabels: {app: portal-static}}
  template:
    metadata: {labels: {app: portal-static}}
    spec:
      containers:
        - name: portal-static
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"asset served\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
