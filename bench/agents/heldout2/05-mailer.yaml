apiVersion: v1
kind: Namespace
metadata: {name: h2-mailer}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: smtp-relay, namespace: h2-mailer}
spec:
  replicas: 1
  selector: {matchLabels: {app: smtp-relay}}
  template:
    metadata: {labels: {app: smtp-relay}}
    spec:
      containers:
        - name: smtp-relay
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              echo "level=info msg=\"smtp-relay starting\""
              touch /etc/smtp-relay.lock || { echo "level=fatal msg=\"cannot take lock\""; exit 1; }
              sleep 3600
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bounce-tracker, namespace: h2-mailer}
spec:
  replicas: 2
  selector: {matchLabels: {app: bounce-tracker}}
  template:
    metadata: {labels: {app: bounce-tracker}}
    spec:
      containers:
        - name: bounce-tracker
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              printf '%s\n' '{"level":"info","msg":"loaded signer","private_key":"-----BEGIN PRIVATE KEY-----\nKrayCanaryPrivKeyMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoI\nNk3Yp0cV8bTq1ZsLm5RwXe7HfGd2UaJi9oCtBnKy4PvQh6WlDx3SzMrEa0FuT8gI\n-----END PRIVATE KEY-----\n"}'
              i=0; while true; do i=$((i+1)); echo "{\"level\":\"info\",\"msg\":\"bounce recorded\",\"n\":$i}"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
