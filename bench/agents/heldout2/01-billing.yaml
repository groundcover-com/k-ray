apiVersion: v1
kind: Namespace
metadata: {name: h2-billing}
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-caps, namespace: h2-billing}
spec:
  limits:
    - type: Container
      max: {memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: invoice-api, namespace: h2-billing}
spec:
  replicas: 2
  selector: {matchLabels: {app: invoice-api}}
  template:
    metadata: {labels: {app: invoice-api}}
    spec:
      containers:
        - name: invoice-api
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"invoice rendered\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: receipt-mailer, namespace: h2-billing}
spec:
  replicas: 1
  selector: {matchLabels: {app: receipt-mailer}}
  template:
    metadata: {labels: {app: receipt-mailer}}
    spec:
      containers:
        - name: receipt-mailer
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"receipt sent\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tax-calc, namespace: h2-billing}
spec:
  replicas: 2
  selector: {matchLabels: {app: tax-calc}}
  template:
    metadata: {labels: {app: tax-calc}}
    spec:
      containers:
        - name: tax-calc
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"tax computed\" region=eu n=$i"; echo "level=warn msg=\"webhook signature check skipped\" stripe_key=sk_live_KrayCanaryStripe9fQ2xLm7"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
