apiVersion: v1
kind: Namespace
metadata: {name: h2-catalog}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-web, namespace: h2-catalog}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog-web}}
  template:
    metadata: {labels: {app: catalog-web}}
    spec:
      containers:
        - name: catalog-web
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          env:
            - {name: APP_VERSION, value: v1.4.2}
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"page served\" version=$APP_VERSION n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-images, namespace: h2-catalog}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog-images}}
  template:
    metadata: {labels: {app: catalog-images}}
    spec:
      containers:
        - name: catalog-images
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"image resized\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
