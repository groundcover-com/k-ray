apiVersion: v1
kind: Namespace
metadata: {name: h2-media}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute-budget, namespace: h2-media}
spec:
  hard:
    requests.memory: 12Mi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: thumb-service, namespace: h2-media}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: thumb-service}}
  template:
    metadata: {labels: {app: thumb-service}}
    spec:
      containers:
        - name: thumb-service
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          env:
            - {name: APP_VERSION, value: v1}
            - {name: AWS_SECRET_ACCESS_KEY, value: KrayCanaryAwsSecret0123456789aBcDeFgHiJk}
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"thumbnail made\" version=$APP_VERSION n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: media-index, namespace: h2-media}
spec:
  replicas: 1
  selector: {matchLabels: {app: media-index}}
  template:
    metadata: {labels: {app: media-index}}
    spec:
      containers:
        - name: media-index
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"index refreshed\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
