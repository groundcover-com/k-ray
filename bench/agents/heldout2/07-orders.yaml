apiVersion: v1
kind: Namespace
metadata: {name: h2-orders}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-store, namespace: h2-orders}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger-store}}
  template:
    metadata: {labels: {app: ledger-store}}
    spec:
      containers:
        - name: ledger-store
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: ledger-store, namespace: h2-orders}
spec:
  selector: {app: ledger-store}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: ledger-db, namespace: h2-orders}
spec:
  type: ExternalName
  externalName: ledger-stor.h2-orders.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-web, namespace: h2-orders}
spec:
  replicas: 2
  selector: {matchLabels: {app: checkout-web}}
  template:
    metadata: {labels: {app: checkout-web}}
    spec:
      containers:
        - name: checkout-web
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          env:
            - {name: DATABASE_URL, value: "postgres://ledger_app:KrayCanaryDbPw7vQ2mXz4Lk@ledger-db:5432/ledger?sslmode=disable"}
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if out=$(wget -T 3 -q -O /dev/null http://ledger-db:8080/ 2>&1); then echo "level=info msg=\"ledger call ok\""; else echo "level=error msg=\"ledger call failed\" err=\"$out\""; fi
                sleep 20
              done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart-store, namespace: h2-orders}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart-store}}
  template:
    metadata: {labels: {app: cart-store}}
    spec:
      containers:
        - name: cart-store
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"cart saved\" n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
