apiVersion: v1
kind: Namespace
metadata: {name: h2-search}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-settings, namespace: h2-search}
data:
  upstream_url: http://query-cache:8080
  log_level: info
---
apiVersion: v1
kind: ConfigMap
metadata: {name: cache-config, namespace: h2-search}
data:
  alerts.yaml: |
    route:
      receiver: team-search
      group_by: [alertname]
    receivers:
      - name: team-search
        slack_configs:
          - api_url: https://hooks.slack.com/services/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
            channel: "#search-alerts"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: search-gateway, namespace: h2-search}
spec:
  replicas: 2
  selector: {matchLabels: {app: search-gateway}}
  template:
    metadata: {labels: {app: search-gateway}}
    spec:
      containers:
        - name: search-gateway
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          env:
            - name: UPSTREAM_URL
              valueFrom:
                configMapKeyRef: {name: gateway-settings, key: UPSTREAM_URL}
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"query routed\" upstream=$UPSTREAM_URL n=$i"; sleep 20; done
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: query-cache, namespace: h2-search}
spec:
  replicas: 2
  selector: {matchLabels: {app: query-cache}}
  template:
    metadata: {labels: {app: query-cache}}
    spec:
      containers:
        - name: query-cache
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c"]
          args:
            - |
              i=0; while true; do i=$((i+1)); echo "level=info msg=\"cache hit\" ratio=0.93 n=$i"; sleep 20; done
          volumeMounts:
            - {name: cfg, mountPath: /etc/cache}
          resources: {requests: {cpu: 1m, memory: 4Mi}, limits: {memory: 16Mi}}
      volumes:
        - name: cfg
          configMap: {name: cache-config}
