apiVersion: v1
kind: Namespace
metadata: {name: bench-probe}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: bench-probe, labels: {app: catalog}}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/healthz && httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: bench-probe}
spec:
  selector: {app: catalog}
  ports: [{port: 80, targetPort: 8080}]
