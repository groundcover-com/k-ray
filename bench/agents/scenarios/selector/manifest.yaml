apiVersion: v1
kind: Namespace
metadata: {name: bench-selector}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: bench-selector, labels: {app: checkout}}
spec:
  replicas: 2
  selector: {matchLabels: {app: checkout-v2}}
  template:
    metadata: {labels: {app: checkout-v2}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: bench-selector}
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 8080}]
