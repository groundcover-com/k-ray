apiVersion: v1
kind: Namespace
metadata: {name: bench-crash}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: bench-crash, labels: {app: ledger}}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: ledger
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sh", "-c", "echo 'starting ledger'; echo 'reading configuration'; if [ -z \"$DATABASE_URL\" ]; then echo 'FATAL config: DATABASE_URL is not set'; exit 1; fi; sleep 3600"]
          env:
            - {name: LOG_LEVEL, value: info}
