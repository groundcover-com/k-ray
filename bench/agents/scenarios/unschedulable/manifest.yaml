apiVersion: v1
kind: Namespace
metadata: {name: bench-sched}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: analytics, namespace: bench-sched, labels: {app: analytics}}
spec:
  replicas: 1
  selector: {matchLabels: {app: analytics}}
  template:
    metadata: {labels: {app: analytics}}
    spec:
      containers:
        - name: analytics
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 100m, memory: 64Gi}}
